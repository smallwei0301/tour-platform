name: midao-baseline-e2e

on:
  pull_request:
    paths:
      - '.github/workflows/midao-baseline-e2e.yml'
      - 'apps/web/e2e/helpers.ts'
      - 'apps/web/e2e/midao-*.spec.ts'
      - 'apps/web/e2e/t1-login.spec.ts'
      - 'apps/web/playwright.config.ts'
      - 'apps/web/src/lib/guide-auth.ts'
      - 'apps/web/src/lib/guide-session-crypto.ts'
      - 'apps/web/src/lib/midao/db-requests.mjs'
      - 'apps/web/src/lib/midao/**'
      - 'apps/web/tests/api/midao-*.test.mjs'
      - 'apps/web/tests/integration/midao-*.test.mjs'
      - 'apps/web/tests/security/midao-e2e-auth-seam.test.mjs'
      - 'apps/web/tests/unit/midao-*.test.mjs'
      - 'scripts/database-baseline/**'
      - 'scripts/testing/midao-e2e-seed.sql'
      - 'scripts/testing/run-midao-*.sh'
      - 'scripts/testing/with-midao-local-supabase.mjs'
      - 'supabase/baselines/v1/**'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'

permissions:
  contents: read

concurrency:
  group: midao-baseline-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Generate ephemeral guide session secret
        shell: bash
        run: |
          set -euo pipefail
          guide_session_secret="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          printf '::add-mask::%s\n' "$guide_session_secret"
          printf 'GUIDE_SESSION_SECRET=%s\n' "$guide_session_secret" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund

      - name: Install PostgreSQL client when absent
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x /usr/bin/psql; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
          test -x /usr/bin/psql

      - name: Install digest-verified Supabase CLI 2.87.2
        shell: bash
        run: |
          set -euo pipefail
          archive_sha='57aedd36f41297d27cc642c9d7582e89994916e2d86be3c4aca87ab079980767'
          binary_sha='e325dd50b274e88fd1416f93b9e063902827ae326d356ab7f9dc604c3eba5c59'
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$tmp/supabase.tar.gz" \
            'https://github.com/supabase/cli/releases/download/v2.87.2/supabase_linux_amd64.tar.gz'
          printf '%s  %s\n' "$archive_sha" "$tmp/supabase.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$tmp/supabase.tar.gz" --directory "$tmp" supabase
          printf '%s  %s\n' "$binary_sha" "$tmp/supabase" | sha256sum --check --strict
          sudo install --directory --owner=root --group=root --mode=0755 /root/.hermes/toolchains/supabase/2.87.2
          sudo install --owner=root --group=root --mode=0755 "$tmp/supabase" /root/.hermes/toolchains/supabase/2.87.2/supabase
          if ! command -v setfacl >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends acl
          fi
          runner_user="$(id -un)"
          sudo setfacl -m "u:$runner_user:--x" /root
          sudo setfacl -m "u:$runner_user:r-x" /root/.hermes /root/.hermes/toolchains /root/.hermes/toolchains/supabase /root/.hermes/toolchains/supabase/2.87.2
          sudo setfacl -m "u:$runner_user:r-x" /root/.hermes/toolchains/supabase/2.87.2/supabase
          getfacl --absolute-names /root/.hermes/toolchains/supabase/2.87.2/supabase | grep -F "user:$runner_user:r-x"
          printf '%s  %s\n' "$binary_sha" /root/.hermes/toolchains/supabase/2.87.2/supabase | sha256sum --check --strict
          test "$(/root/.hermes/toolchains/supabase/2.87.2/supabase --version)" = '2.87.2'

      - name: Provision digest-bound database and API images
        shell: bash
        run: |
          set -euo pipefail
          lock='supabase/baselines/v1/toolchain-lock.json'
          provision() {
            local role="$1"
            local ref image_id repository tag observed_id observed_architecture pull_log attempt
            ref="$(jq -er --arg role "$role" '.images[] | select(.role == $role) | .repoDigest' "$lock")"
            image_id="$(jq -er --arg role "$role" '.images[] | select(.role == $role) | .imageId' "$lock")"
            repository="$(jq -er --arg role "$role" '.images[] | select(.role == $role) | .repository' "$lock")"
            tag="$(jq -er --arg role "$role" '.images[] | select(.role == $role) | .tag' "$lock")"
            pull_log="$(mktemp)"
            for attempt in 1 2 3 4; do
              if docker pull "$ref" >"$pull_log" 2>&1; then
                cat "$pull_log"
                break
              fi
              cat "$pull_log" >&2
              if ! grep -Eqi 'toomanyrequests|rate exceeded' "$pull_log" || test "$attempt" = 4; then
                rm -f -- "$pull_log"
                return 1
              fi
              sleep "$((attempt * 15))"
            done
            rm -f -- "$pull_log"
            observed_id="$(docker image inspect --format '{{.Id}}' "$ref")"
            observed_architecture="$(docker image inspect --format '{{.Architecture}}' "$ref")"
            test "$observed_id" = "$image_id"
            test "$observed_architecture" = 'amd64'
            docker image inspect --format '{{json .RepoDigests}}' "$ref" | jq -e --arg ref "$ref" 'index($ref) != null'
            docker tag "$ref" "$repository:$tag"
            test "$(docker image inspect --format '{{.Id}}' "$repository:$tag")" = "$image_id"
          }
          provision db
          provision api

      - name: Build deterministic expected-terminal artifacts
        run: >-
          timeout --signal=TERM --kill-after=30s 1200s
          node scripts/database-baseline/build-expected-terminal.mjs
          --runs 2
          --baseline supabase/baselines/v1
          --publish-dir supabase/baselines/v1
          --capture-ledger docs/operations/baseline-ledger.json
          --ledger docs/operations/expected-terminal-ledger.json

      - name: Upload deterministic expected-terminal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midao-expected-terminal-${{ github.sha }}
          path: |
            supabase/baselines/v1/manifest.json
            supabase/baselines/v1/catalog.expected-terminal.normalized.json
            supabase/baselines/v1/catalog-expected-terminal.sha256
            docs/operations/expected-terminal-ledger.json
          if-no-files-found: error
          retention-days: 1

      # Keep the transaction contract ahead of the committed-artifact diff gate so
      # a migration PR records the behavioral RED/GREEN result even while its newly
      # generated expected-terminal artifact is still awaiting promotion.
      - name: 'Prove #1811 public required-write fault was RED on the historical sequential writer (auth shim)'
        if: ${{ github.event.pull_request.number == 1818 && github.head_ref == 'agent/issue-1811-order-transaction' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          red_commit='268f2356cf809548800ecbb2b197b7c12cd5f461'
          historical_route_sha='434ca5e8bd8f3a983cfb8eff83f15dc517f46cb1ac9ef06510441259672c4818'
          shimmed_route_sha='879836f27c4ab33621a7b3220a35291ceb3574b2cc0f43980778c845ae835746'
          route='apps/web/app/api/v2/bookings/draft/route.ts'
          backup="$(mktemp /tmp/issue1811-route.XXXXXX)"
          output="$(mktemp /tmp/issue1811-red-output.XXXXXX)"
          cleanup() {
            cp -- "$backup" "$route"
            rm -f -- "$backup" "$output"
          }
          cp -- "$route" "$backup"
          trap cleanup EXIT
          git fetch --no-tags --depth=20 origin "refs/heads/$GITHUB_HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD_SHA"
          git merge-base --is-ancestor "$red_commit" FETCH_HEAD
          git cat-file -e "$red_commit:$route"
          git show "$red_commit:$route" > "$route"
          test "$(sha256sum "$route" | cut -d ' ' -f 1)" = "$historical_route_sha"

          # The current baseline intentionally revokes direct bookings/orders DML
          # from anon/authenticated. The historical route predates its service-role
          # gateway, so use the ephemeral loopback service role only to reach and
          # isolate the historical sequential-write behavior under test.
          ROUTE_PATH="$route" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const route = process.env.ROUTE_PATH;
          if (!route) throw new Error('missing historical route path');
          const source = readFileSync(route, 'utf8');
          const legacyClient = '    const supabase = await createClient();';
          const legacyWriteMarker = '    // 6. Create booking (draft status)';
          const clientOccurrences = source.split(legacyClient).length - 1;
          const writeMarkerOccurrences = source.split(legacyWriteMarker).length - 1;
          if (clientOccurrences !== 1 || writeMarkerOccurrences !== 1) {
            throw new Error(
              `historical compatibility seams changed: client=${clientOccurrences}, write=${writeMarkerOccurrences}`,
            );
          }
          const compatibilityWriteMarker = [
            '    // Historical RED authorization compatibility shim (ephemeral loopback only).',
            '    supabase = await getSupabase();',
            '',
            legacyWriteMarker,
          ].join('\n');
          writeFileSync(
            route,
            source
              .replace(legacyClient, '    let supabase = await createClient();')
              .replace(legacyWriteMarker, compatibilityWriteMarker),
          );
          NODE
          test "$(sha256sum "$route" | cut -d ' ' -f 1)" = "$shimmed_route_sha"
          printf '%s\n' \
            'historical RED compatibility: current baseline grants reject legacy anon table writes; using only the ephemeral loopback service role'

          set +e
          ISSUE1811_PUBLIC_RED_PROBE=1 \
            timeout --signal=TERM --kill-after=30s 1200s \
            node scripts/testing/with-midao-local-supabase.mjs --postgrest \
            apps/web/tests/integration/midao-issue1811-order-transaction-postgrest.test.mjs \
            >"$output" 2>&1
          status=$?
          set -e

          grep -E \
            'ISSUE1811_PUBLIC_|ISSUE1811_ORDER_ITEMS_BOOM|public draft route fails closed|AssertionError|failureType:|error:|bookings:|orders:|items:|statusLogs:|ERR_[A-Z_]+' \
            "$output" || true
          if test "$status" -ne 1; then
            printf 'historical public RED probe exited %s; expected the test runner to exit 1\n' "$status"
            exit 1
          fi
          grep -F 'ISSUE1811_PUBLIC_REQUIRED_WRITE_FAULT_REACHED' "$output"
          grep -F \
            'ISSUE1811_PUBLIC_REQUIRED_WRITE_FAULT_RESULT:{"status":200,"success":true,"errorCode":null,"hasBookingId":true,"hasOrderId":true,"counts":{"bookings":1,"orders":1,"items":0,"statusLogs":1}}' \
            "$output"
          grep -F -C 8 'ISSUE1811_PUBLIC_REQUIRED_WRITE_FAULT_RED' "$output"
          cp -- "$backup" "$route"
          git diff --exit-code -- "$route"
          rm -f -- "$backup" "$output"
          trap - EXIT
          printf 'historical sequential-writer mutation witness reproduced at the public HTTP seam with an authorization compatibility shim (commit=%s, exit=%s)\n' \
            "$red_commit" "$status"

      - name: 'Run #1811 booking-order transaction PostgreSQL and PostgREST runtime contract'
        env:
          ISSUE1811_PUBLIC_RED_PROBE: '0'
        run: >-
          timeout --signal=TERM --kill-after=30s 1200s
          node scripts/testing/with-midao-local-supabase.mjs --postgrest
          apps/web/tests/integration/midao-issue1811-order-transaction-postgrest.test.mjs

      - name: 'Run #1812 add-on atomicity PostgreSQL and public draft runtime contract'
        run: >-
          timeout --signal=TERM --kill-after=30s 1200s
          node scripts/testing/with-midao-local-supabase.mjs --postgrest
          apps/web/tests/integration/midao-issue1812-addon-atomicity-postgrest.test.mjs

      - name: 'Run #1813 points atomicity PostgreSQL and authenticated public draft runtime contract'
        run: >-
          timeout --signal=TERM --kill-after=30s 1200s
          node scripts/testing/with-midao-local-supabase.mjs --api-real-auth
          apps/web/tests/integration/midao-issue1813-points-atomicity-real-auth.test.mjs

      - name: 'Run #1813 anonymous points rejection PostgreSQL and public draft runtime contract'
        run: >-
          timeout --signal=TERM --kill-after=30s 1200s
          node scripts/testing/with-midao-local-supabase.mjs --postgrest
          apps/web/tests/integration/midao-issue1813-points-atomicity-postgrest.test.mjs

      - name: Verify deterministic expected-terminal artifacts are committed
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            supabase/baselines/v1/manifest.json \
            supabase/baselines/v1/catalog.expected-terminal.normalized.json \
            supabase/baselines/v1/catalog-expected-terminal.sha256 \
            docs/operations/expected-terminal-ledger.json

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Midao baseline infrastructure contracts
        env:
          NODE_ENV: test
        run: timeout --signal=TERM --kill-after=30s 600s node scripts/testing/run-ordinary-web-tests.mjs --portable-infrastructure

      - name: Run Task14 PostgreSQL and PostgREST request contracts
        run: >-
          timeout --signal=TERM --kill-after=30s 1200s
          node scripts/testing/with-midao-local-supabase.mjs --postgrest
          apps/web/tests/integration/midao-requests-postgrest.test.mjs

      - name: Run Task20B booking decision PostgreSQL and PostgREST runtime contracts
        run: >-
          timeout --signal=TERM --kill-after=30s 1200s
          node scripts/testing/with-midao-local-supabase.mjs --postgrest
          apps/web/tests/integration/midao-booking-decision-postgrest.test.mjs

      - name: Run baseline-backed Midao browser gate
        run: >-
          timeout --signal=TERM --kill-after=30s 1200s bash scripts/testing/run-midao-e2e.sh
          apps/web/e2e/midao-navigation.spec.ts
          apps/web/e2e/midao-auth-and-impersonation.spec.ts
          apps/web/e2e/midao-home.spec.ts
          apps/web/e2e/midao-requests.spec.ts
          apps/web/e2e/midao-services.spec.ts
          apps/web/e2e/midao-inquiry-conversion.spec.ts

      - name: Run Package 4 real-HTTP API chain gate (public inquiry to checkout, no mocks)
        run: >-
          timeout --signal=TERM --kill-after=30s 1200s
          env MIDAO_DB_HEALTH_TIMEOUT_SECONDS=600
          bash scripts/testing/run-midao-e2e.sh
          apps/web/tests/integration/midao-inquiry-conversion-api-chain.test.mjs

      - name: Run baseline-backed legacy login compatibility
        run: >-
          timeout --signal=TERM --kill-after=30s 1200s bash scripts/testing/run-midao-legacy-e2e-compat.sh
          apps/web/e2e/t1-login.spec.ts

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: midao-baseline-e2e-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
