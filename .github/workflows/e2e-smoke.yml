name: e2e-smoke

# Issue #1275 — focused Playwright smoke lane for launch-critical browser flows.
#
# This is a SEPARATE workflow from ci.yml (which stays lint → typecheck → node
# test → build → preflight, unchanged). It runs a small, bounded allowlist of
# durable, backend-mocked Playwright specs (no real Supabase / payment mutation)
# so browser-only regressions are caught without opening a one-off QA issue.
#
# Triggers:
#   - workflow_dispatch — manual run / post-merge evidence.
#   - schedule          — daily safety net.
#   - pull_request (path-filtered) — only PRs touching the booking/guide browser
#     surfaces or the e2e specs/workflow, to keep the lane focused and cheap.
#
# Adding a spec to the smoke lane: append it to the `test:e2e:smoke` script in
# apps/web/package.json. Only add specs that (a) mock the backend via
# page.route(), (b) need no real Supabase/payment/PII data, and (c) are stable
# under `--workers=1`. Keep total runtime within the timeout budget below.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *' # daily 02:00 UTC
  pull_request:
    paths:
      - 'apps/web/app/booking/**'
      - 'apps/web/app/guide/**'
      - 'apps/web/e2e/**'
      - 'apps/web/playwright.config.ts'
      - 'apps/web/package.json'
      - '.github/workflows/e2e-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISABLE_SENTRY_BUILD: '1'
      # Non-production dummy values only (mirrors ci.yml). The Playwright config's
      # managed webServer (`npm run dev`) inherits these so admin/guide session
      # minting works; specs mock all data APIs via page.route().
      GUIDE_SESSION_SECRET: ci-guide-session-secret-0123456789abcdef
      ADMIN_ACCESS_TOKEN: ci-admin-token-0123456789abcdef
      ADMIN_EMAIL_ALLOWLIST: admin@tour-platform.com
      ADMIN_EMAIL: admin@tour-platform.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run focused E2E smoke (bounded allowlist)
        run: npm run test:e2e:smoke -w @tour/web

      # Supplemental ordinary CI only: existing managed Chromium, unchanged mock specs.
      # This does not replace canonical host E2E evidence or clear its HOLD.
      # Separate processes retain each spec's owned 3108 fixture and cleanup.
      - name: Supplemental ordinary CI - upcoming schedules (12 cases)
        id: supplemental_upcoming
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node_dir="$(dirname "$(command -v node)")"
          test "$(/usr/bin/env -i PATH="$node_dir:/usr/bin:/bin" "$node_dir/node" -p "process.versions.node.split('.')[0]")" = 22
          browser_cache="$HOME/.cache/ms-playwright"
          test -d "$browser_cache"
          for directory in . apps apps/web; do
            if test -e "$directory/.npmrc" || test -L "$directory/.npmrc"; then exit 1; fi
          done
          cache="$(mktemp -d)"
          trap 'rm -rf -- "$cache"' EXIT
          : > "$cache/user.npmrc"
          : > "$cache/global.npmrc"
          /usr/bin/env -i PATH="$node_dir:/usr/bin:/bin" \
            PLAYWRIGHT_NO_WEBSERVER=1 PLAYWRIGHT_BROWSERS_PATH="$browser_cache" \
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 NEXT_TELEMETRY_DISABLED=1 \
            npm_config_offline=true npm_config_ignore_scripts=true \
            npm_config_audit=false npm_config_fund=false npm_config_update_notifier=false \
            npm_config_yes=false npm_config_script_shell=/bin/sh \
            npm_config_userconfig="$cache/user.npmrc" npm_config_globalconfig="$cache/global.npmrc" \
            npm_config_cache="$cache" \
            npm run test:e2e -w @tour/web -- e2e/issue1882-upcoming-schedules.spec.ts --output=test-results/issue1882-upcoming

      - name: Supplemental ordinary CI - policy display (3 cases)
        if: ${{ !cancelled() && (steps.supplemental_upcoming.outcome == 'success' || steps.supplemental_upcoming.outcome == 'failure') }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          node_dir="$(dirname "$(command -v node)")"
          test "$(/usr/bin/env -i PATH="$node_dir:/usr/bin:/bin" "$node_dir/node" -p "process.versions.node.split('.')[0]")" = 22
          browser_cache="$HOME/.cache/ms-playwright"
          test -d "$browser_cache"
          for directory in . apps apps/web; do
            if test -e "$directory/.npmrc" || test -L "$directory/.npmrc"; then exit 1; fi
          done
          cache="$(mktemp -d)"
          trap 'rm -rf -- "$cache"' EXIT
          : > "$cache/user.npmrc"
          : > "$cache/global.npmrc"
          /usr/bin/env -i PATH="$node_dir:/usr/bin:/bin" \
            PLAYWRIGHT_NO_WEBSERVER=1 PLAYWRIGHT_BROWSERS_PATH="$browser_cache" \
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 NEXT_TELEMETRY_DISABLED=1 \
            npm_config_offline=true npm_config_ignore_scripts=true \
            npm_config_audit=false npm_config_fund=false npm_config_update_notifier=false \
            npm_config_yes=false npm_config_script_shell=/bin/sh \
            npm_config_userconfig="$cache/user.npmrc" npm_config_globalconfig="$cache/global.npmrc" \
            npm_config_cache="$cache" \
            npm run test:e2e -w @tour/web -- e2e/issue1882-policy-display.spec.ts --output=test-results/issue1882-policy

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
